<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>学习目标管理台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%236366f1'/%3E%3Ccircle cx='12' cy='12' r='5.5' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='1.6' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f5fa;
    --card:#ffffff;
    --ink:#1c2333;
    --ink-2:#5a6378;
    --ink-3:#6b7280;
    --line:#e8eaf2;
    --brand:#4f46e5;
    --brand-2:#7c3aed;
    --green:#047857;
    --red:#dc2626;
    --amber:#92400e;
    --radius:16px;
    --shadow:0 1px 2px rgba(28,35,51,.05),0 6px 24px -8px rgba(28,35,51,.10);
    --shadow-lg:0 8px 40px -8px rgba(99,102,241,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    min-height:100vh;min-height:100dvh;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(79,70,229,.28);outline-offset:2px}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
  .num{font-variant-numeric:tabular-nums}

  .hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 58%,#9333ea 100%);color:#fff;padding:28px 20px 44px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 1.2px,transparent 1.2px);background-size:22px 22px;opacity:.5}
  .hero::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
  .hero-inner{max-width:960px;margin:0 auto;position:relative;z-index:1}
  .hero h1{font-size:26px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
  .hero .tag{opacity:.92;font-size:14px;margin-top:6px}
  .hero-chips{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.16);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 14px;font-size:13px;display:flex;align-items:center;gap:6px}
  .chip b{font-size:15px}

  @media(min-width:768px){.today-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.today-grid .goal-row{margin-bottom:0}}

  .mine-list{display:flex;flex-direction:column;gap:10px}
  .mine-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:0 16px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;font-weight:600;color:var(--ink);background:#fafbff;transition:transform .15s}
  .mine-btn:active{transform:scale(.98)}
  .mine-btn.danger{color:var(--red)}
  .mine-btn.confirming{background:var(--red);color:#fff;border-color:var(--red)}
  .mine-note{list-style:none;font-size:13px;color:var(--ink-2)}
  .mine-note li{padding:6px 0 6px 20px;position:relative}
  .mine-note li::before{content:"";position:absolute;left:4px;top:14px;width:6px;height:6px;border-radius:2px;background:var(--brand)}
  .steps{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink-2)}
  .steps .step{display:flex;align-items:center;gap:10px}
  .steps .no{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}

  .nav{position:sticky;top:0;z-index:20;background:rgba(244,245,250,.92);backdrop-filter:blur(8px);max-width:960px;margin:14px auto 0;padding:8px 20px}
  .nav-inner{display:flex;background:#e9ebf4;border-radius:12px;padding:4px;gap:4px}
  .nav button{flex:1;min-height:44px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s}
  .nav button.active{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(28,35,51,.10)}

  main{max-width:960px;margin:0 auto;padding:16px 20px 90px}
  .tab-panel{display:none;animation:fadeUp .3s ease}
  .tab-panel.active{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card{background:var(--card);border:1px solid rgba(28,35,51,.05);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  .card-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .card-title .dot{width:8px;height:8px;border-radius:3px;background:var(--brand);flex:none}
  .muted{color:var(--ink-2);font-size:13px}
  .tiny{font-size:12px;color:var(--ink-3)}

  .sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
  .sync-badge.synced{background:#e8f6f0;color:var(--green)}
  .sync-badge.syncing{background:#eef0ff;color:var(--brand)}
  .sync-badge.offline{background:#fef2f2;color:var(--red)}
  .sync-dot{width:8px;height:8px;border-radius:50%}
  .sync-dot.synced{background:var(--green)}
  .sync-dot.syncing{background:var(--brand);animation:pulse-dot 1s infinite}
  .sync-dot.offline{background:var(--red)}
  @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}

  .quick-add-row{display:flex;justify-content:flex-end;margin:-2px 0 14px}
  .quick-add-row .btn{box-shadow:none}
  .today-zone{margin-bottom:14px}
  .missed-card{background:linear-gradient(135deg,#fef2f2,#fff5f5);border:1.5px solid #fecaca;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;animation:pulse-border 2s infinite}
  @keyframes pulse-border{0%,100%{border-color:#fecaca}50%{border-color:#f87171}}
  .missed-card .icon{width:40px;height:40px;border-radius:12px;background:#fee2e2;color:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
  .missed-card .info{flex:1;min-width:0}
  .missed-card .info b{font-size:14px}
  .missed-card .info .why{color:var(--red);font-size:12px;font-weight:600}
  .missed-card .actions{display:flex;flex-direction:column;gap:8px;flex:none}
  .rest-card{background:linear-gradient(135deg,#fffbeb,#fffdf5);border:1.5px solid #fde68a;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
  .rest-card .icon{width:40px;height:40px;border-radius:12px;background:#fef3c7;color:var(--amber);display:flex;align-items:center;justify-content:center;flex:none}
  .rest-card .info{flex:1;min-width:0}
  .rest-card .info b{font-size:14px}
  .rest-card .info .why{color:#b45309;font-size:12px;font-weight:600}
  .plan-line{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.5;display:flex;gap:5px;align-items:flex-start}
  .plan-line .tag-rest{flex:none;font-weight:700;color:var(--brand)}
  .plan-line-board{font-size:12px;color:var(--ink-2);background:#f6f7fd;border-radius:10px;padding:8px 10px;margin-bottom:10px;line-height:1.5}
  .plan-line-board b{color:var(--brand)}
  .btn-amber{background:var(--amber);color:#fff}
  .btn{min-height:44px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,opacity .15s;flex:none}
  .btn:active{transform:scale(.96)}
  .btn-red{background:var(--red);color:#fff}
  .btn-brand{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:var(--shadow-lg)}
  .btn-ghost{background:#eef0f8;color:var(--ink-2)}
  .btn-green{background:var(--green);color:#fff}
  .all-done{background:linear-gradient(135deg,#ecfdf5,#f0fdf4);border:1.5px solid #a7f3d0;border-radius:var(--radius);padding:16px;text-align:center;color:#047857;font-weight:600;font-size:14px}

  .goal-row{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;transition:border-color .2s,background .2s}
  .goal-row.done{background:#f0fdf9;border-color:#a7f3d0}
  .goal-row.overdue{border-color:#fecaca}
  .goal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .goal-color-dot{width:12px;height:12px;border-radius:4px;flex:none}
  .goal-name{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;flex:none}
  .badge-overdue{background:#fee2e2;color:var(--red)}
  .badge-done{background:#d1fae5;color:#047857}
  .badge-today{background:#e0e7ff;color:var(--brand)}
  .badge-sample{background:#f3f4f6;color:var(--ink-3)}
  .mini-progress{height:8px;background:#eef0f6;border-radius:99px;overflow:hidden;margin-bottom:12px;box-shadow:inset 0 1px 2px rgba(28,35,51,.07)}
  .mini-progress i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
  .checkin{display:flex;gap:8px;flex-wrap:wrap}
  .checkin .field{flex:1;min-width:100px}
  .checkin label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:4px;font-weight:600}
  .checkin input,.checkin select{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:#fafbff;outline:none;transition:border-color .15s}
  .checkin input:focus,.checkin select:focus{border-color:var(--brand)}
  .checkin .btn{align-self:flex-end}
  .today-note{font-size:12px;color:#047857;font-weight:600;margin-top:8px;display:flex;align-items:center;gap:5px}

  .board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .goal-card{background:var(--card);border:1px solid rgba(28,35,51,.05);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;transition:transform .2s ease,box-shadow .2s ease}
  .ring-wrap{display:flex;gap:16px;align-items:center;margin-bottom:14px}
  .ring{position:relative;width:96px;height:96px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct b{font-size:20px;line-height:1.1}
  .ring .pct span{font-size:10px;color:var(--ink-3)}
  .ring-stats{flex:1;min-width:0}
  .stat-line{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
  .stat-line:last-child{flex-basis:100%;margin-bottom:0}
  .stat-line b{color:var(--ink)}
  .stat-line svg{flex:none}
  .eta-ahead{color:var(--green);font-weight:700}
  .eta-behind{color:var(--red);font-weight:700}
  .streak-flame{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:#f97316}
  .recent-logs{border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
  .recent-logs .log-item{display:flex;align-items:center;font-size:12px;color:var(--ink-2);padding:3px 0;gap:6px}
  .recent-logs .log-item .del{margin-left:auto;color:var(--ink-3);width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .recent-logs .log-item .del:active{background:#fee2e2;color:var(--red)}
  .recent-logs .log-item .del.confirming{width:auto;padding:0 8px;background:var(--red);color:#fff;font-weight:600}
  .badge-makeup{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:#eef0f6;color:var(--ink-3);flex:none}
  .toggle-logs{font-size:12px;color:var(--brand);font-weight:600;padding:6px 0;min-height:32px}

  .chart-scroll{overflow-x:auto}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .legend span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

  .manage-row{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .manage-row .info{flex:1;min-width:0}
  .manage-row .info b{display:block;font-size:14px}
  .icon-btn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);background:#f4f5fa;flex:none;transition:all .15s;font-size:13px;font-weight:600}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.danger.confirming{background:var(--red);color:#fff;width:auto;padding:0 14px}
  .fab-add{width:100%;min-height:52px;border:2px dashed #c7cbf0;border-radius:14px;color:var(--brand);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;background:#fafbff}

  .modal-mask{position:fixed;inset:0;background:rgba(20,24,40,.5);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:0}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:slideUp .28s ease;max-height:88vh;overflow-y:auto}
  @media(min-width:640px){.modal-mask{align-items:center;padding:20px}.modal{border-radius:20px;max-width:560px;box-shadow:0 24px 80px -12px rgba(20,24,40,.35)}}
  @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .modal h3{font-size:17px;font-weight:800;margin-bottom:16px}
  .form-row{margin-bottom:14px}
  .form-row label,.form-label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .form-row input,.form-row select{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fafbff;outline:none}
  .form-row input:focus{border-color:var(--brand)}
  .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .color-pick{display:flex;gap:10px;flex-wrap:wrap}
  .color-pick button{width:44px;height:44px;border-radius:12px;border:3px solid transparent;transition:all .15s}
  .color-pick button.sel{border-color:var(--ink);transform:scale(1.08)}
  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .modal-actions .btn{flex:1;min-height:50px}

  .week-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .week-nav .btn{flex:none}
  .week-nav .label{flex:1;text-align:center;font-weight:700;font-size:14px}
  .week-summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .week-summary-row:last-child{border-bottom:none}
  .week-summary-row .vals{text-align:right;font-size:13px;color:var(--ink-2)}
  .week-summary-row .vals b{color:var(--ink)}
  .week-compare{font-size:11px;color:var(--ink-3);margin-top:2px}
  .kpt-row{margin-bottom:12px}
  .kpt-row label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .kpt-row label .hint{font-weight:400;color:var(--ink-3);font-size:12px}
  .kpt-row input{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fafbff;outline:none}
  .kpt-row input:focus{border-color:var(--brand)}
  textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fafbff;outline:none;resize:vertical;line-height:1.5}
  textarea:focus{border-color:var(--brand)}
  .report-preview{background:#1c2333;color:#d5dbea;border-radius:12px;padding:16px;font-size:13px;line-height:1.8;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-top:12px}

  .footer{max-width:960px;margin:0 auto;padding:0 20px 40px;text-align:center}
  .footer .danger-zone{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .footer .tiny{margin-top:12px}

  .toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);opacity:0;background:#1c2333;color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;z-index:99;transition:all .3s;pointer-events:none;max-width:86vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  .confetti_bit{position:fixed;top:-12px;z-index:98;border-radius:2px;pointer-events:none;animation:confetti-fall linear forwards}
  @keyframes confetti-fall{to{transform:translateY(105vh) rotate(720deg);opacity:.7}}

  .empty{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:14px}
  .loading-skeleton{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:14px}

  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

  .stat-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .stat-card{background:var(--card);border:1px solid rgba(28,35,51,.05);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:11px;min-width:0;transition:transform .2s,box-shadow .2s}
  .stat-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
  .stat-ico svg{width:18px;height:18px}
  .stat-text{display:flex;flex-direction:column;min-width:0}
  .stat-num{font-size:19px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums}
  .stat-lbl{font-size:12px;color:var(--ink-2);white-space:nowrap}
  @media(min-width:768px){.stat-strip{grid-template-columns:repeat(4,1fr)}}

  .done-sec{margin-top:18px}
  .done-sec-title{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700;color:var(--green);margin-bottom:10px}
  .done-sec-title .cnt{background:#e8f6f0;color:var(--green);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700}

  .rhythm{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .rhythm-day{text-align:center;padding:8px 2px;border-radius:10px;background:#f7f8fc;transition:background .2s}
  .rhythm-day .dl{font-size:11px;color:var(--ink-3)}
  .rhythm-day .dd{font-size:15px;font-weight:800;margin-top:1px;line-height:1.35;color:var(--ink-3)}
  .rhythm-day .dm{font-size:10.5px;color:var(--ink-3);min-height:14px}
  .rhythm-day.hit{background:#eef0ff}
  .rhythm-day.hit .dd{color:var(--brand)}
  .rhythm-day.today{outline:2px solid rgba(99,102,241,.45);outline-offset:-2px}
  .rhythm-day.future{opacity:.45}

  .board-bottom{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px;align-items:start}
  @media(min-width:1024px){.board-bottom{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}.board-bottom .card{margin-bottom:0}}
  .heat-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--ink-3);text-align:center;margin-bottom:3px}
  .heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:2px}
  .heat-cell{height:14px;border-radius:4px;background:#eef0f6}
  .heat-cell.l1{background:rgba(99,102,241,.22)}
  .heat-cell.l2{background:rgba(99,102,241,.45)}
  .heat-cell.l3{background:rgba(99,102,241,.72)}
  .heat-cell.l4{background:#6366f1}
  .heat-cell.today{outline:2px solid rgba(28,35,51,.35);outline-offset:-1px}
  .heat-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font-size:11px;color:var(--ink-3)}
  .heat-legend .heat-cell{width:11px;height:11px}
  .feed-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .feed-row:last-child{border-bottom:none}
  .feed-dot{width:9px;height:9px;border-radius:99px;flex:none}
  .feed-main{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .feed-main b{font-weight:600}

<script>
(function(){
"use strict";

/* ================= Database IDs ================= */
var DB_GOALS  = '8KHgH9HisYlOM9DJ8eUq2Y';
var DB_LOGS   = 'Bi3gTkZ6AFyQjzK2rSt81K';
var DB_WEEKLY = 'F2x7lMhyySHExOSDadXyKr';
var DATABASE_ID = '8KHgH9HisYlOM9DJ8eUq2Y';

var ONLINE = false;
var db = null;
try { if (window.__SMART_PAGE__ && window.__SMART_PAGE__.database) { db = window.__SMART_PAGE__.database; ONLINE = true; } } catch(e) {}

/* ================= State ================= */
var state = { goals: [], logs: [], notes: {}, loaded: false };
var lastSyncTime = null;
var syncStatus = "loading"; /* loading | synced | syncing | offline */

var COLORS = ["#6366f1","#f59e0b","#10b981","#0ea5e9","#8b5cf6","#ef4444","#f97316","#14b8a6"];

/* ================= Utils ================= */
function pad(n){ return (n<10?"0":"")+n; }
function fmtDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseDate(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(s,n){ var d=parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d); }
function diffDays(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }
function fmtShort(s){ var p=s.split("-"); return (+p[1])+"/"+(+p[2]); }
function trimNum(n){ if(Math.abs(n-Math.round(n))<1e-9) return String(Math.round(n)); return (Math.round(n*10)/10).toString(); }
function uid(){ return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function mondayOf(dateStr){ var d=parseDate(dateStr); var dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return fmtDate(d); }
function finiteNumber(v,min,max){ return typeof v==="number" && Number.isFinite(v) && v>=min && v<=max; }

/* ================= Date parsing from DB ================= */
function dbDateToStr(v){ if(!v) return todayStr(); var s=String(v); return s.slice(0,10); }
function dbNum(v){ return typeof v==="number" ? v : (typeof v==="string" ? Number(v) : 0) || 0; }
function dbStr(v){ return v==null ? "" : String(v); }
function dbBool(v){ return v===true; }

/* ================= Sync Status UI ================= */
function setSync(status){
  syncStatus = status;
  var badge = document.getElementById("syncBadge");
  var text = document.getElementById("syncText");
  var time = document.getElementById("syncTime");
  if(!badge) return;
  badge.className = "sync-badge " + status;
  badge.querySelector(".sync-dot").className = "sync-dot " + status;
  if(status==="loading") text.textContent = "加载中…";
  else if(status==="syncing") text.textContent = "同步中…";
  else if(status==="synced") text.textContent = "已同步";
  else if(status==="offline") text.textContent = "离线模式";
  if(lastSyncTime && (status==="synced"||status==="offline")){
    time.textContent = "上次同步：" + lastSyncTime;
  } else { time.textContent = ""; }
}

/* ================= Data Loading ================= */
function loadAll(callback){
  if(!ONLINE){
    /* 本地预览模式：从 localStorage 加载数据 */
    loadFromCache();
    setSync("offline");
    if(callback) callback(true);
    return;
  }
  setSync("syncing");
  var pending = 3, failed = false;
  function done(ok){ pending--; if(!ok) failed=true; if(pending<=0){ if(failed){ setSync("offline"); /* 加载失败时降级到 localStorage */ loadFromCache(); render(); toast("在线数据加载失败，已切到本地缓存"); } else { setSync("synced"); saveCache(); lastSyncTime = new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}); } state.loaded=true; if(callback) callback(!failed); } }

  loadGoals(function(){ done(true); }, function(){ done(false); });
  loadLogs(function(){ done(true); }, function(){ done(false); });
  loadNotes(function(){ done(true); }, function(){ done(false); });
}

function loadAllPaged(DATABASE_ID, callback, errback){
  var all = [], cursor = null;
  function fetchPage(){
    db.query({ databaseId: DATABASE_ID, pageSize: 100, startCursor: cursor }).then(function(result){
      all = all.concat(result.results || []);
      if(result.hasMore && result.nextCursor){ cursor = result.nextCursor; fetchPage(); }
      else { callback(all); }
    }).catch(function(err){ console.error("db.query failed for", DATABASE_ID, err); errback(err); });
  }
  fetchPage();
}

/* ================= Calculations (same logic as original) ================= */
function goalById(id){ for(var i=0;i<state.goals.length;i++) if(state.goals[i].id===id) return state.goals[i]; return null; }
function doneAmount(gid){ var s=0; for(var i=0;i<state.logs.length;i++) if(state.logs[i].goalId===gid) s+=state.logs[i].amount; return s; }
function logsOn(gid,dateStr){ var s=0; for(var i=0;i<state.logs.length;i++) if(state.logs[i].goalId===gid && state.logs[i].date===dateStr) s+=state.logs[i].amount; return s; }
function minutesOn(gid,dateStr){ var s=0; for(var i=0;i<state.logs.length;i++) if(state.logs[i].goalId===gid && state.logs[i].date===dateStr && state.logs[i].minutes) s+=state.logs[i].minutes; return s; }
function hasLogOn(gid,dateStr){ for(var i=0;i<state.logs.length;i++) if(state.logs[i].goalId===gid && state.logs[i].date===dateStr) return true; return false; }
function dateSetOf(gid){ var s={}; for(var i=0;i<state.logs.length;i++) if(state.logs[i].goalId===gid) s[state.logs[i].date]=1; return s; }
function isRestDay(gid, d, dates){ var g=goalById(gid); if(!g) return false; var mon=mondayOf(d); var start = mon < g.createdAt ? g.createdAt : mon; var cur=start; while(cur<d){ if(!dates[cur]) return false; cur=addDays(cur,1); } return true; }
function streak(gid){ var g=goalById(gid); if(!g) return 0; var dates=dateSetOf(gid); var d=todayStr(); if(!dates[d]) d=addDays(d,-1); var s=0; while(d>=g.createdAt){ if(dates[d]){ s++; d=addDays(d,-1); continue; } if(isRestDay(gid,d,dates)){ d=addDays(d,-1); continue; } break; } return s; }
function last7Sum(gid){ var t=todayStr(), from=addDays(t,-6), s=0; for(var i=0;i<state.logs.length;i++){ var l=state.logs[i]; if(l.goalId===gid && l.date>=from && l.date<=t) s+=l.amount; } return s; }
function eta(e){ var done=doneAmount(e.id), remain=e.total-done; if(remain<=0) return {status:"done"}; var speed=last7Sum(e.id)/7; if(speed<=0) return {status:"unknown"}; var days=Math.ceil(remain/speed); var etaDate=addDays(todayStr(),days); var diff=diffDays(etaDate,e.deadline); return {status:"ok",date:etaDate,diff:diff}; }
function dailySuggest(g){ var remain=g.total-doneAmount(g.id); if(remain<=0) return 0; var daysLeft=diffDays(todayStr(),g.deadline); if(daysLeft<0) return remain; return Math.ceil(remain/Math.max(1,daysLeft+1)*10)/10; }
function isComplete(g){ return doneAmount(g.id)>=g.total; }
function isOverdue(g){ return !isComplete(g) && diffDays(todayStr(),g.deadline)<0; }
function missedYesterday(g){ if(isComplete(g) || hasLogOn(g.id,todayStr())) return false; if(g.createdAt>addDays(todayStr(),-1)) return false; return !hasLogOn(g.id, addDays(todayStr(),-1)); }

  var active=state.goals.filter(function(g){ return !isComplete(g); });
  if(active.length===0){ box.innerHTML=''; return; }
  var t=todayStr(), mon=mondayOf(t);
  var CN=["一","二","三","四","五","六","日"];
  var cells='', total=0;
  for(var i=0;i<7;i++){
    var d=addDays(mon,i), m=minutesTotalOn(d); total+=m;
    var future=d>t;
    var cls='rhythm-day'+(m>0?' hit':'')+(d===t?' today':'')+(future?' future':'');
    cells+='<div class="'+cls+'"><div class="dl">'+CN[i]+'</div><div class="dd">'+(m>0?'✓':(future?'':'·'))+'</div><div class="dm">'+(m>0?m+'分':'')+'</div></div>';
  }
  box.innerHTML='<div class="card" style="margin-top:14px"><div class="card-title">'+ICON.calendar+'本周打卡节奏<span style="margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:400">本周已投入 <b class="num">'+total+'</b> 分钟</span></div><div class="rhythm">'+cells+'</div></div>';
}

/* ================= Board ================= */
function renderBoard(){
  var html='';
  if(state.goals.length===0) html='<div class="card empty" style="grid-column:1/-1">暂无目标。</div>';
  var active=[], done=[];
  state.goals.forEach(function(g){ if(isComplete(g)) done.push(g); else active.push(g); });
  active.forEach(function(g){ html+=boardCardHtml(g); });
  if(done.length>0){
    html+='<div class="board-sec-title"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>已完成<span class="cnt">'+done.length+'</span></div>';
    done.forEach(function(g){ html+=boardCardHtml(g); });
  }
  $("boardGrid").innerHTML=html;
  renderChart();
  renderBoardStats();
  renderBoardBottom();
}

function boardCardHtml(g){
  var done=doneAmount(g.id), pct=Math.min(100, done/g.total*100);
  var st=streak(g.id), e=eta(g);
  var C=2*Math.PI*40, off=C*(1-pct/100);
  var etaHtml='';
  if(e.status==="done") etaHtml='<span class="eta-ahead">已达成</span>';
  else if(e.status==="unknown") etaHtml='<span style="color:var(--ink-3)">近 7 天无记录，暂无推算</span>';
  else{ var cmp = e.diff>=0 ? '<span class="eta-ahead">提前 '+e.diff+' 天</span>' : '<span class="eta-behind">拖后 '+(-e.diff)+' 天</span>'; etaHtml=fmtShort(e.date)+' · '+cmp; }
  return '<div class="goal-card">'+
    '<div class="goal-head" style="margin-bottom:12px"><span class="goal-color-dot" style="background:'+g.color+'"></span><span class="goal-name">'+esc(g.name)+'</span>'+(g.sample?'<span class="badge badge-sample" style="margin-left:auto">示例</span>':'')+'</div>'+
    '<div class="ring-wrap"><div class="ring"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="#eef0f6" stroke-width="10"/><circle cx="48" cy="48" r="40" fill="none" stroke="'+g.color+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" style="transition:stroke-dashoffset .6s ease"/></svg><div class="pct"><b class="num">'+Math.round(pct)+'%</b><span>完成率</span></div></div>'+
    '<div class="ring-stats">'+
      '<div class="stat-line">'+ICON.trend+'<b class="num">'+trimNum(done)+'</b>&nbsp;/ '+trimNum(g.total)+' '+esc(g.unit)+'</div>'+
      '<div class="stat-line">'+ICON.flame.replace('currentColor','#f97316')+'连续 <b class="num">&nbsp;'+st+'&nbsp;</b> 天</div>'+
      '<div class="stat-line">'+ICON.calendar+'预计 <b>&nbsp;'+etaHtml+'</b></div>'+
    '</div></div>'+
    (g.plan?'<div class="plan-line-board"><b>预案</b> '+(g.obstacle?'如果'+esc(g.obstacle)+'，我就':'')+esc(g.plan)+'</div>':'')+
    renderRecentLogs(g)+
  '</div>';
}

function renderBoardStats(){
  var box=$("boardStats");
  if(state.goals.length===0){ box.innerHTML=''; box.style.display='none'; return; }
  box.style.display='';
  var active=0, fin=0;
  state.goals.forEach(function(g){ if(isComplete(g)) fin++; else active++; });
  var tmin=0; state.logs.forEach(function(l){ tmin+=(l.minutes||0); });
  var tminTxt = tmin>=60 ? trimNum(Math.round(tmin/60*10)/10)+' 小时' : tmin+' 分钟';
  box.innerHTML =
    statCard(STAT_ICONS.target,'#6366f1','#eef0ff', active, '进行中目标')+
    statCard(STAT_ICONS.flag,'#059669','#e8f6f0', fin, '已完成目标')+
    statCard(STAT_ICONS.check,'#d97706','#fef3e2', state.logs.length, '累计打卡（次）')+
    statCard(STAT_ICONS.clock,'#7c3aed','#f1eafe', tminTxt, '累计投入');
}
function renderBoardBottom(){
  var box=$("boardBottom");
  if(state.logs.length===0){ box.innerHTML=''; return; }
  var t=todayStr(), start=addDays(t,-34);
  var offset=diffDays(mondayOf(start), start);
  var cells='';
  for(var i=0;i<offset;i++) cells+='<span></span>';
  for(var j=0;j<35;j++){
    var d=addDays(start,j), m=minutesTotalOn(d);
    var lv = m<=0?0 : m<30?1 : m<60?2 : m<90?3 : 4;
    cells+='<span class="heat-cell'+(lv>0?' l'+lv:'')+(d===t?' today':'')+'" title="'+d+' · '+(m>0?m+' 分钟':'未打卡')+'"></span>';
  }
  var heat='<div class="card"><div class="card-title">'+ICON.calendar+'近 35 天打卡热力<span style="margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:400">颜色越深投入越多</span></div><div class="heat-days"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="heat-grid">'+cells+'</div><div class="heat-legend">少<span class="heat-cell"></span><span class="heat-cell l1"></span><span class="heat-cell l2"></span><span class="heat-cell l3"></span><span class="heat-cell l4"></span>多</div></div>';
  var logs=state.logs.slice().sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); }).slice(0,8);
  var rows='';
  logs.forEach(function(l){
    var g=goalById(l.goalId); if(!g) return;
    var dl = l.date===t ? '今天' : (l.date===addDays(t,-1) ? '昨天' : fmtShort(l.date));
    rows+='<div class="feed-row"><span class="feed-dot" style="background:'+g.color+'"></span><div class="feed-main"><b>'+esc(g.name)+'</b> +'+trimNum(l.amount)+' '+esc(g.unit)+(l.minutes?' · '+l.minutes+' 分钟':'')+(l.makeup?' <span class="badge-makeup">补</span>':'')+'</div><span class="feed-date">'+dl+'</span></div>';
  });
  var feed='<div class="card"><div class="card-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>最近动态</div>'+(rows || '<div class="tiny" style="color:var(--ink-3)">暂无记录</div>')+'</div>';
  box.innerHTML=heat+feed;
}

var logsExpanded={};
function renderRecentLogs(g){
  var arr=state.logs.filter(function(l){return l.goalId===g.id;}).sort(function(a,b){return a.date<b.date?1:-1;});
  if(arr.length===0) return '';
  var open=!!logsExpanded[g.id];
  var html='<button class="toggle-logs" data-togglelogs="'+g.id+'">'+(open?'收起记录 ▴':'查看 '+arr.length+' 条记录 ▾')+'</button>';
  if(open){
    html+='<div class="recent-logs">';
    arr.slice(0,10).forEach(function(l){
      html+='<div class="log-item"><span class="num">'+fmtShort(l.date)+'</span><b class="num">+'+trimNum(l.amount)+'</b> '+esc(g.unit)+(l.minutes?' · '+l.minutes+' 分钟':'')+(l.makeup?'<span class="badge-makeup">补</span>':'')+'<button class="del" data-dellog="'+l.id+'" title="删除这条记录">✕</button></div>';
    });
    if(arr.length>10) html+='<div class="tiny">仅显示最近 10 条</div>';
    html+='</div>';
  }
  return html;
}

function renderChart(){
  var days=[], i, t=todayStr();
  for(i=13;i>=0;i--) days.push(addDays(t,-i));
  var data={}, max=0, usedGoals={};
  days.forEach(function(d){ data[d]={}; var sum=0; state.goals.forEach(function(g){ var v=minutesOn(g.id,d); if(v>0){ data[d][g.id]=v; sum+=v; usedGoals[g.id]=1; } }); if(sum>max) max=sum; });
  if(max===0){ $("chartBox").innerHTML='<div class="empty">近 14 天暂无用时记录；为目标设置「每次预估时长」后打卡会自动填入</div>'; $("chartLegend").innerHTML=''; return; }
  var W=680,H=210,padL=42,padB=26,padT=10,plotW=W-padL-8,plotH=H-padT-padB;
  var bw=Math.min(26, plotW/14*0.55), gap=plotW/14;
  var step=Math.max(1,max/4), mag=Math.pow(10,Math.floor(Math.log10(step)));
  var yMax=Math.ceil(max/4/mag)*mag*4; if(yMax<=0)yMax=max;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:520px;display:block" role="img" aria-label="近 14 天各目标投入分钟数堆叠图">';
  for(i=0;i<=4;i++){ var v=yMax*i/4, y=padT+plotH-(v/yMax)*plotH; svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#eef0f6" stroke-width="1"/><text x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#6b7280">'+trimNum(v)+'分</text>'; }
  days.forEach(function(d,idx){ var x=padL+gap*idx+(gap-bw)/2, cursor=padT+plotH; state.goals.forEach(function(g){ var v=data[d][g.id]; if(!v)return; var h=(v/yMax)*plotH; cursor-=h; svg+='<rect x="'+x.toFixed(1)+'" y="'+cursor.toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" fill="'+g.color+'" rx="2"><title>'+esc(g.name)+' '+fmtShort(d)+' · '+trimNum(v)+' 分钟</title></rect>'; }); if(idx%2===0||idx===13) svg+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#6b7280">'+fmtShort(d)+'</text>'; });
  svg+='</svg>';
  $("chartBox").innerHTML=svg;
  var lg=''; state.goals.forEach(function(g){ if(usedGoals[g.id]) lg+='<span><i style="background:'+g.color+'"></i>'+esc(g.name)+'</span>'; });
  $("chartLegend").innerHTML=lg;
}

/* ================= Weekly ================= */
var weekOffset=0;
function currentWeekRange(){ var mon=mondayOf(todayStr()); var start=addDays(mon, weekOffset*7); return { start:start, end:addDays(start,6) }; }
function weekStats(start,end){
  var per={}, totalMin=0;
  state.goals.forEach(function(g){
    var sum=0, days={}, mins=0;
    state.logs.forEach(function(l){ if(l.goalId===g.id && l.date>=start && l.date<=end){ sum+=l.amount; days[l.date]=1; if(l.minutes) mins+=l.minutes; } });
    per[g.id]={ sum:sum, days:Object.keys(days).length, mins:mins };
    totalMin+=mins;
  });
  return { per:per, totalMin:totalMin };
}
function readNoteForm(){ return { keep:$("noteKeep").value.trim(), problem:$("noteProblem").value.trim(), try:$("noteTry").value.trim(), next:$("noteNext").value.trim() }; }
function renderWeekly(){
  var r=currentWeekRange();
  var isCur=weekOffset===0;
  $("weekLabel").textContent=fmtShort(r.start)+" - "+fmtShort(r.end)+(isCur?"（本周）":"");
  $("weekNext").style.visibility = weekOffset<0 ? "visible":"hidden";
  var cur=weekStats(r.start,r.end);
  var prev=weekStats(addDays(r.start,-7), addDays(r.start,-1));
  var html='', any=false;
  state.goals.forEach(function(g){
    var c=cur.per[g.id], p=prev.per[g.id];
    if(c.sum>0||c.days>0) any=true;
    if(isComplete(g) && c.days===0) return;
    var cmp='';
    if(p.sum>0||p.days>0){ cmp='<div class="week-compare">上周 '+(p.sum>0?'+'+trimNum(p.sum)+' '+esc(g.unit)+' · ':'')+'打卡 '+p.days+' 天'+(p.mins>0?' · '+p.mins+' 分钟':'')+'</div>'; }
    html+='<div class="week-summary-row"><span><span class="goal-color-dot" style="background:'+g.color+';display:inline-block;margin-right:6px;vertical-align:-1px"></span>'+esc(g.name)+'</span><span class="vals">'+(c.sum>0?'<b class="num">+'+trimNum(c.sum)+'</b> '+esc(g.unit)+' · ':'')+'打卡 <b class="num">'+c.days+'</b> 天'+(c.mins>0?' · <span class="num">'+c.mins+'</span> 分钟':'')+cmp+'</span></div>';
  });
  if(!any) html='<div class="empty" style="padding:20px">这一周还没有打卡记录</div>';
  else{
    var minCmp='';
    if(prev.totalMin>0){ var dm=cur.totalMin-prev.totalMin; minCmp='<div class="week-compare">上周 '+prev.totalMin+' 分钟'+(dm!==0?'（较上周 '+(dm>0?'+':'')+dm+'）':'')+'</div>'; }
    html+='<div class="week-summary-row" style="border-top:1px solid var(--line);margin-top:4px"><b>合计投入</b><span class="vals"><b class="num">'+cur.totalMin+'</b> 分钟'+minCmp+'</span></div>';
  }
  $("weekSummary").innerHTML=html;
  var wk=r.start, n=state.notes[wk]||{};
  $("noteKeep").value=n.keep||"";
  $("noteProblem").value=n.problem||"";
  $("noteTry").value=n.try||"";
  $("noteNext").value=n.next||"";
  $("reportBox").style.display="none";
}

function buildReportText(){
  var r=currentWeekRange();
  var cur=weekStats(r.start,r.end);
  var prev=weekStats(addDays(r.start,-7), addDays(r.start,-1));
  var lines=["【学习周报】"+fmtShort(r.start)+" - "+fmtShort(r.end)];
  state.goals.forEach(function(g){
    var c=cur.per[g.id], p=prev.per[g.id];
    if(c.sum>0||c.days>0){
      var pct=Math.min(100,Math.round(doneAmount(g.id)/g.total*100));
      var line="- "+g.name+"：+"+trimNum(c.sum)+" "+g.unit+"，打卡 "+c.days+" 天（累计 "+pct+"%）";
      if(p.sum>0) line+="｜上周 +"+trimNum(p.sum)+" "+g.unit;
      lines.push(line);
    }
  });
  if(cur.totalMin>0){ var mline="本周总投入："+cur.totalMin+" 分钟"; if(prev.totalMin>0) mline+="（上周 "+prev.totalMin+" 分钟）"; lines.push(mline); }
  var n=state.notes[r.start]||{};
  if(n.keep) lines.push("保持："+n.keep);
  if(n.problem) lines.push("问题："+n.problem);
  if(n.try) lines.push("尝试："+n.try);
  if(n.next) lines.push("下周预案："+n.next);
  return lines.join("\n");
}

function copyText(text, okMsg){
  function fallback(){ var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast(okMsg); }catch(e){ toast("复制失败，请手动选择复制"); } document.body.removeChild(ta); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback); }else fallback();
}

/* ================= Checkin & Celebrate ================= */
function doCheckin(gid){
  var g=goalById(gid); if(!g) return;
  var amtEl=$("amt-"+gid), minEl=$("min-"+gid), dateEl=$("date-"+gid);
  var amt=Number(amtEl.value);
  if(!finiteNumber(amt,0.000000001,1000000000000)){ toast("完成数量需为有效正数"); amtEl.focus(); return; }
  /* 用时：用户填了就用用户值；填了 0 也算 0；空着则回退到目标默认时长 */
  var mins = (minEl && minEl.value!=="") ? Number(minEl.value) : (g.defaultMinutes || 0);
  if(!finiteNumber(mins,0,1440)){ toast("用时需为 0–1440 分钟"); minEl.focus(); return; }
  var date=(dateEl&&dateEl.value)?dateEl.value:todayStr();
  if(date<addDays(todayStr(),-6) || date>todayStr()) date=todayStr();
  var makeup = date<todayStr();
  var wasComplete=isComplete(g);
  var rec={ id:uid(), goalId:gid, goalName:g.name, date:date, amount:amt, unit:g.unit, minutes:mins, makeup:makeup, ts:new Date().toISOString() };
  /* Optimistic: update local state immediately */
  state.logs.push(rec);
  render();
  if(!wasComplete && isComplete(g)){ celebrate(); toast("目标「"+g.name+"」达成，恭喜！"); }
  else if(makeup){ toast("已补记 "+fmtShort(date)+"：+"+trimNum(amt)+" "+g.unit); }
  else{ toast("已打卡 +"+trimNum(amt)+" "+g.unit); }
  /* Write to database */
  setSync("syncing");
  dbAddLog(rec, function(newId){
    rec.id = newId;
    setSync("synced"); lastSyncTime = new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2"});
    setSync("synced");
  }, function(e){
    console.error("dbAddLog failed:",e);
    /* 云端写失败：保留本地数据，只提示，不删除 —— 否则会出现"打卡消失"假象 */
    if(ONLINE){
      setSync("offline");
      toast("已存到本地，云端同步失败，请稍后点「手动重新同步」");
    } else {
      setSync("synced");
    }
  });
}

function celebrate(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var colors=COLORS.concat(["#fbbf24","#34d399"]);
  for(var i=0;i<70;i++){
    var b=document.createElement("div");
    b.className="confetti-bit";
    var size=6+Math.random()*8;
    b.style.left=(Math.random()*100)+"vw";
    b.style.width=size+"px"; b.style.height=(size*0.5)+"px";
    b.style.background=colors[i%colors.length];
    b.style.animationDuration=(1.4+Math.random()*1.4)+"s";
    b.style.animationDelay=(Math.random()*0.4)+"s";
    document.body.appendChild(b);
    (function(el){ setTimeout(function(){ el.remove(); },3200); })(b);
  }
}

/* ================= Confirm Helper ================= */
function armConfirm(btn, label, action){
  if(btn.dataset.armed==="1"){ btn.dataset.armed=""; action(); return; }
  btn.dataset.armed="1";
  var old=btn.innerHTML;
  btn.innerHTML=label;
  btn.classList.add("confirming");
  if(btn.classList.contains("btn")) btn.style.background="var(--red)", btn.style.color="#fff";
  setTimeout(function(){ if(btn.dataset.armed){ btn.dataset.armed=""; btn.innerHTML=old; btn.classList.remove("confirming"); btn.style.background=""; btn.style.color=""; } },3000);
}

/* ================= Events ================= */
function switchTab(name,focusTab){
  document.querySelectorAll(".nav button").forEach(function(x){
    var on=x.dataset.tab===name;
    x.classList.toggle("active",on);
    x.setAttribute("aria-selected",on?"true":"false");
    x.tabIndex=on?0:-1;
    if(on && focusTab) x.focus();
  });
  document.querySelectorAll(".tab-panel").forEach(function(p){
    var on=p.id==="panel-"+name;
    p.classList.toggle("active",on);
    p.setAttribute("aria-hidden",on?"false":"true");
  });
}

function bind(){
  var tabs=Array.prototype.slice.call(document.querySelectorAll(".nav button"));
  tabs.forEach(function(b,idx){
    b.addEventListener("click",function(){ switchTab(b.dataset.tab); });
    b.addEventListener("keydown",function(e){
      if(e.key!=="ArrowRight" && e.key!=="ArrowLeft" && e.key!=="Home" && e.key!=="End") return;
      e.preventDefault();
      var next=e.key==="Home"?0:e.key==="End"?tabs.length-1:(idx+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;
      switchTab(tabs[next].dataset.tab,true);
    });
  });

  var sideAddBtn=$("btnSideAdd");
  if(sideAddBtn) sideAddBtn.addEventListener("click",function(){ openGoalModal(null); });

  document.querySelector("main").addEventListener("click",function(e){
    var t=e.target.closest("[data-checkin]");
    if(t){ doCheckin(t.dataset.checkin); return; }
    t=e.target.closest("[data-addgoal]");
    if(t){ openGoalModal(null); return; }
    t=e.target.closest("[data-goto]");
    if(t){ switchTab(t.dataset.goto); return; }
    t=e.target.closest("[data-togglelogs]");
    if(t){ var g=t.dataset.togglelogs; logsExpanded[g]=!logsExpanded[g]; renderBoard(); return; }
    t=e.target.closest("[data-dellog]");
    if(t){
      var id=t.dataset.dellog;
      armConfirm(t,"确认？",function(){
        var rec = state.logs.find(function(l){return l.id===id;});
        state.logs=state.logs.filter(function(l){return l.id!==id;});
        render(); toast("已删除该条记录");
        if(rec){ setSync("syncing"); dbDeleteLog(rec.id, function(){ setSync("synced"); lastSyncTime=new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2"}); setSync("synced"); }, function(){ setSync("offline"); toast("删除记录失败，请稍后重试"); }); }
      });
      return;
    }
    t=e.target.closest("[data-edit]");
    if(t){ openGoalModal(goalById(t.dataset.edit)); return; }
    t=e.target.closest("[data-del]");
    if(t){
      var gid=t.dataset.del;
      armConfirm(t,"确认删除？",function(){
        var g=goalById(gid);
        state.goals=state.goals.filter(function(x){return x.id!==gid;});
        state.logs=state.logs.filter(function(l){return l.goalId!==gid;});
        render(); toast("已删除「"+(g?g.name:"")+"」及其全部记录");
        if(g){ dbDeleteGoal(g.id, function(){}, function(){ toast("删除目标同步失败，请稍后重试"); }); }
      });
      return;
    }
    t=e.target.closest("#btnClearAll");
    if(t){
      var v=prompt("将删除全部目标与打卡记录，且不可恢复。\n请输入「清空」二字确认：");
      if(v==="清空"){
        var goals=state.goals.slice(), logs=state.logs.slice(), weeks=Object.keys(state.notes);
        state.goals=[]; state.logs=[]; state.notes={}; render();
        toast("正在清空…");
        setSync("syncing");
        var delpending = goals.length + logs.length + weeks.length;
        function checkDone(){ delpending--; if(delpending<=0){ try{ localStorage.removeItem(LS_KEY); }catch(e){} setSync("synced"); lastSyncTime=new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2"}); setSync("synced"); toast("已清空全部数据"); } }
        goals.forEach(function(g){ dbDeleteGoal(g.id, checkDone, checkDone); });
        logs.forEach(function(l){ dbDeleteLog(l.id, checkDone, checkDone); });
        weeks.forEach(function(wk){ var n=state.notes[wk]; if(n&&n.recordId) db.deleteRecord({databaseId:'F2x7lMhyySHExOSDadXyKr', recordId:n.recordId}).then(checkDone).catch(checkDone); else checkDone(); });
      }
      else if(v!==null) toast("未输入「清空」，已取消");
      return;
    }
    t=e.target.closest("#btnClearSample");
    if(t){
      var sampleGoals=state.goals.filter(function(g){return g.sample;});
      if(sampleGoals.length===0){ toast("没有示例数据"); return; }
      state.goals=state.goals.filter(function(g){return !g.sample;});
      var sampleIds=sampleGoals.map(function(g){return g.id;});
      state.logs=state.logs.filter(function(l){return sampleIds.indexOf(l.goalId)<0;});
      render(); toast("已清空示例数据");
      sampleGoals.forEach(function(g){ dbDeleteGoal(g.id, function(){}, function(){}); });
      return;
    }
    t=e.target.closest("#btnResync");
    if(t){
      if(!ONLINE){
        toast("当前是本地预览模式，请用线上链接同步数据");
        return;
      }
      toast("正在重新同步…");
      loadAll(function(ok){ if(ok){ render(); toast("同步完成"); } });
      return;
    }
  });

  document.querySelector("main").addEventListener("keydown",function(e){
    if(e.key==="Enter" && e.target.id && e.target.id.indexOf("amt-")===0){ doCheckin(e.target.id.slice(4)); }
  });

  $("modalCancel").addEventListener("click",closeGoalModal);
  $("goalModal").addEventListener("click",function(e){ if(e.target===$("goalModal")) closeGoalModal(); });
  $("goalModal").addEventListener("keydown",function(e){
    if(e.key==="Escape"){ e.preventDefault(); closeGoalModal(); return; }
    if(e.key!=="Tab") return;
    var items=Array.prototype.slice.call($("goalModal").querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')).filter(function(x){return x.offsetParent!==null;});
    if(!items.length) return;
    var first=items[0],last=items[items.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  });
  $("colorPick").addEventListener("click",function(e){
    var b=e.target.closest("[data-color]"); if(!b)return;
    pickedColor=b.dataset.color;
    $("colorPick").querySelectorAll("button").forEach(function(x){x.classList.remove("sel");x.setAttribute("aria-pressed","false");});
    b.classList.add("sel"); b.setAttribute("aria-pressed","true");
  });
  $("modalSave").addEventListener("click",function(){
    var name=$("fName").value.trim(), unit=$("fUnit").value.trim()||"个";
    var total=Number($("fTotal").value), dl=$("fDeadline").value;
    var defaultMin=Number($("fDefaultMin").value);
    if(!name){ toast("请填写目标名称"); $("fName").focus(); return; }
    if(!finiteNumber(total,0.000000001,1000000000000)){ toast("总量需为有效正数"); $("fTotal").focus(); return; }
    if(!dl || !/^\d{4}-\d{2}-\d{2}$/.test(dl)){ toast("请选择有效截止日"); $("fDeadline").focus(); return; }
    if(!editingGoalId && dl<todayStr()){ toast("截止日不能早于今天"); return; }
    if($("fDefaultMin").value && !finiteNumber(defaultMin,0,1440)){ toast("预估时长需为 0–1440 分钟"); $("fDefaultMin").focus(); return; }
    defaultMin = finiteNumber(defaultMin,0,1440) ? defaultMin : 0;
    if(editingGoalId){
      var g=goalById(editingGoalId);
      g.name=name; g.unit=unit; g.total=total; g.deadline=dl; g.color=pickedColor;
      g.obstacle=$("fObstacle").value.trim(); g.plan=$("fPlan").value.trim();
      g.defaultMinutes=defaultMin;
      closeGoalModal(); render(); toast("目标已更新");
      setSync("syncing");
      dbUpdateGoal(g, function(){ setSync("synced"); lastSyncTime=new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2"}); setSync("synced"); }, function(){ setSync("offline"); toast("同步失败，请稍后重试"); });
    }else{
      var ng={ id:uid(), name:name, unit:unit, total:total, deadline:dl, color:pickedColor, createdAt:todayStr(), obstacle:$("fObstacle").value.trim(), plan:$("fPlan").value.trim(), defaultMinutes:defaultMin, sample:false };
      state.goals.push(ng);
      closeGoalModal(); render(); toast("已创建目标「"+name+"」");
      setSync("syncing");
      dbAddGoal(ng, function(newId){ ng.id=newId; render(); setSync("synced"); lastSyncTime=new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2"}); setSync("synced"); }, function(e){ console.error("dbAddGoal failed:",e); if(ONLINE){ var idx=state.goals.indexOf(ng); if(idx>=0) state.goals.splice(idx,1); render(); setSync("offline"); toast("创建失败，目标未保存到线上，请稍后用「手动重新同步」重试"); } else { setSync("synced"); } });
    }
  });

  $("weekPrev").addEventListener("click",function(){ weekOffset--; renderWeekly(); });
  $("weekNext").addEventListener("click",function(){ if(weekOffset<0){ weekOffset++; renderWeekly(); } });
  $("btnSaveNote").addEventListener("click",function(){
    var r=currentWeekRange();
    var note = readNoteForm();
    var existing = state.notes[r.start] || {};
    note.recordId = existing.recordId || null;
    state.notes[r.start] = note;
    saveCache(); toast("复盘已保存到本周");
    setSync("syncing");
    dbSaveNote(r.start, note, function(recordId){ if(recordId){ note.recordId=recordId; state.notes[r.start].recordId=recordId; } setSync("synced"); lastSyncTime=new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2"}); setSync("synced"); }, function(){ setSync("offline"); toast("保存复盘失败，请稍后重试"); });
  });
  $("btnGenReport").addEventListener("click",function(){
    var r=currentWeekRange();
    var note = readNoteForm();
    var existing = state.notes[r.start] || {};
    note.recordId = existing.recordId || null;
    state.notes[r.start] = note; saveCache();
    $("reportPreview").textContent=buildReportText();
    $("reportBox").style.display="block";
    setSync("syncing");
    dbSaveNote(r.start, note, function(recordId){ if(recordId){ note.recordId=recordId; state.notes[r.start].recordId=recordId; } setSync("synced"); }, function(){ setSync("offline"); });
  });
  $("btnCopyReport").addEventListener("click",function(){ copyText($("reportPreview").textContent,"周报已复制，去粘贴分享吧"); });
}

/* Local cache: 离线模式下的完整数据存储，也是已同步数据的备份 */
var LS_KEY = "goal_workspace_v3_cache";
function saveCache(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      goals: state.goals,
      logs: state.logs,
      notes: state.notes,
      savedAt: new Date().toISOString()
    }));
  }catch(e){ console.error("saveCache failed:",e); }
}
function loadFromCache(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d){
      if(d.goals) state.goals = d.goals;
      if(d.logs) state.logs = d.logs;
      if(d.notes) state.notes = d.notes;
    }
  }catch(e){ console.error("loadFromCache failed:",e); }
}
function loadCache(){
  /* 兼容旧版：旧 key 只存了 notes，notes 仍在缓存 */
  try{
    var oldRaw = localStorage.getItem("goal_workspace_v2_cache");
    if(oldRaw){
      var od = JSON.parse(oldRaw);
      if(od && od.notes && !Object.keys(state.notes).length) state.notes = od.notes;
    }
    loadFromCache();
  }catch(e){}
}

/* silentResync 已移除 —— 写入后即拉云端会和未提交的写产生竞态，导致本地被云端旧值覆盖。
   改为：本地更新立即生效；云端异步写入失败也不删本地数据；btnResync 是唯一显式拉云端入口。 */

/* ================= Boot ================= */
bind();
render(); /* render empty UI first */
setSync("loading");

/* SDK 可能延迟注入，加重试检测。最多等 2 秒 */
function bootLoad(attempt){
  if(!ONLINE){
    try { if (window.__SMART_PAGE__ && window.__SMART_PAGE__.database) { db = window.__SMART_PAGE__.database; ONLINE = true; } } catch(e) {}
  }
  if(ONLINE){
    loadAll(function(ok){ render(); });
  } else if(attempt < 6){
    setTimeout(function(){ bootLoad(attempt + 1); }, 300);
  } else {
    /* 始终进不来 SDK：进入本地预览模式（数据仅存在本浏览器） */
    loadCache();
    render();
    setSync("offline");
    showOfflineBanner();
  }
}
bootLoad(0);

function showOfflineBanner(){
  var b = document.getElementById("offlineBanner");
  if(!b){
    b = document.createElement("div");
    b.id = "offlineBanner";
    b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;padding:10px 14px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1f1300;font-size:13px;text-align:center;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,0.1);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;";
    b.innerHTML = '<span>⚠️ 本地预览模式 · 数据仅存在本浏览器，不会同步到资料库。请用线上链接保存到云端</span><a href="https://workbuddy.link/p/ApyuWCJSTsXSaVt7W4heLx" target="_blank" style="color:#1f1300;text-decoration:underline;font-weight:700">打开线上版 →</a><button id="closeOfflineBanner" style="background:rgba(0,0,0,0.1);border:none;color:#1f1300;padding:2px 8px;border-radius:4px;cursor:pointer;font-weight:700">×</button>';
    document.body.appendChild(b);
    document.getElementById("closeOfflineBanner").addEventListener("click", function(){ b.style.display="none"; });
    /* 给 hero 区留出空间 */
    var spacer = document.createElement("div");
    spacer.style.height = (b.offsetHeight + 8) + "px";
    spacer.id = "offlineSpacer";
    b.dataset.spacerId = "1";
    document.body.insertBefore(spacer, b.nextSibling);
  }
  b.style.display = "flex";
}

})();
</script>
